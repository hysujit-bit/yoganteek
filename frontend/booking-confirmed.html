<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="./assets/yoganteek_favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed – Yoganteek</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:#C8B8D4; --sage-dark:#5A4A72; --sage-light:#F0EAF5; --sage-wash:#F7F4FB;
      --forest:#6B5B8A; --cream:#FAF7F2; --cream-dark:#F0ECE6;
      --warm-brown:#8B7355; --warm-brown-light:#D4C4A8;
      --text-dark:#2C2C2C; --text-body:#555; --text-light:#888;
      --white:#fff; --accent-gold:#C89B3C;
      --font-heading:'Cormorant Garamond',Georgia,serif;
      --font-body:'DM Sans',-apple-system,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font-body);color:var(--text-dark);background:var(--white);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

    .confirm-page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(135deg,var(--sage-wash) 0%,var(--cream) 50%,var(--sage-wash) 100%);min-height:100vh;}
    .confirm-card{background:var(--white);border-radius:20px;max-width:520px;width:100%;padding:48px 40px;box-shadow:0 20px 60px rgba(107,91,138,.1);text-align:center;}
    .confirm-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--sage-light) 0%,var(--sage) 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
    .confirm-icon svg{width:40px;height:40px;color:var(--forest);}
    .confirm-card h1{font-family:var(--font-heading);font-size:1.8rem;font-weight:600;color:var(--text-dark);margin-bottom:8px;line-height:1.2;}
    .confirm-card h1 em{font-style:italic;color:var(--sage-dark);}
    .confirm-card .subtitle{font-size:.95rem;color:var(--text-body);margin-bottom:28px;}
    .booking-details{background:var(--sage-wash);border-radius:12px;padding:20px 24px;margin-bottom:28px;text-align:left;}
    .booking-details .detail-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
    .booking-details .detail-row:last-child{margin-bottom:0;}
    .booking-details .detail-icon{width:20px;height:20px;color:var(--sage-dark);flex-shrink:0;margin-top:2px;}
    .booking-details .detail-label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--sage-dark);margin-bottom:2px;}
    .booking-details .detail-value{font-size:.95rem;color:var(--text-dark);font-weight:500;}
    .confirm-btn{display:inline-flex;align-items:center;gap:8px;background:var(--forest);color:var(--white);font-family:var(--font-body);font-size:.9rem;font-weight:600;padding:14px 32px;border-radius:30px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;margin-top:8px;}
    .confirm-btn:hover{background:var(--sage-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(107,91,138,.25);}
    .note{font-size:.82rem;color:var(--text-light);margin-top:20px;line-height:1.5;}

    footer{background:var(--forest);color:var(--white);padding:24px;text-align:center;font-size:.8rem;}
    footer a{color:var(--sage);text-decoration:none;}
    footer a:hover{color:var(--white);}

    @media(max-width:560px){
      .confirm-card{padding:36px 24px;}
      .confirm-card h1{font-size:1.5rem;}
    }
  </style>

</head>
<body>

  <div class="confirm-page">
    <div class="confirm-card">

      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h1>Thank you, <em id="visitor-name">!</em></h1>
      <p class="subtitle">Your consultation has been confirmed.</p>

      <div class="booking-details">
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <div>
            <div class="detail-label">Date</div>
            <div class="detail-value" id="booking-date">—</div>
          </div>
        </div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <div class="detail-label">Time (IST)</div>
            <div class="detail-value" id="booking-time">—</div>
          </div>
        </div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <div>
            <div class="detail-label">Type</div>
            <div class="detail-value" id="booking-type">Free Consultation</div>
          </div>
        </div>
        <div class="detail-row" id="meet-link-row" style="display:none;">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <div>
            <div class="detail-label">Google Meet Link</div>
            <div class="detail-value"><a id="meet-link" href="#" target="_blank" style="color:var(--forest);text-decoration:underline;word-break:break-all;"></a></div>
          </div>
        </div>
      </div>

      <a href="index.html" class="confirm-btn">
        Back to Home
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <p class="note">We'll send you a reminder before your session. See you soon!</p>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 Yoganteek Wellness. All rights reserved. | <a href="index.html">yoganteek.com</a></p>
  </footer>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const name  = params.get('name') || 'Guest';
      const date  = params.get('date') || '';
      const time  = params.get('time') || '';
      const meet  = params.get('meet') || '';

      document.getElementById('visitor-name').textContent = name.split(' ')[0] + '!';

      if (date) {
        try {
          const d = new Date(date + 'T00:00:00');
          document.getElementById('booking-date').textContent = d.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        } catch(e) {
          document.getElementById('booking-date').textContent = date;
        }
      } else {
        document.getElementById('booking-date').textContent = 'Please check your email for details.';
      }

      if (time) {
        const [h, m] = time.split(':');
        const hr = parseInt(h, 10);
        const ampm = hr >= 12 ? 'PM' : 'AM';
        const h12 = hr % 12 || 12;
        document.getElementById('booking-time').textContent = h12 + ':' + m + ' ' + ampm + ' IST';
      }

      if (meet) {
        document.getElementById('meet-link-row').style.display = 'flex';
        document.getElementById('meet-link').href = meet;
        document.getElementById('meet-link').textContent = meet;
      }
    })();
  </script>

</body>
</html>
