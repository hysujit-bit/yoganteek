<style>
  /* Header Logo Size */
  .logo-img { height: 4rem; }
  @media (min-width: 768px) { .logo-img { height: 8rem; } }

  /* Nav scroll effect */
  #main-nav { transition: box-shadow 0.3s ease; }
  #main-nav.scrolled { box-shadow: 0 4px 24px rgba(0,0,0,0.09); }

  /* Mobile menu */
  #mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; opacity: 0; }
  #mobile-menu.open { max-height: 420px; opacity: 1; }

  /* Hamburger animation */
  #menu-btn span { display: block; width: 22px; height: 2px; background: #2C2C2C; border-radius: 2px; transition: transform 0.3s, opacity 0.2s; transform-origin: center; }
  #menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  #menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* Active page */
  .nav-link.active, .mobile-link.active { color: #5A4A72 !important; font-weight: 600; }
</style>

<script>
(function(){
  var nav = document.getElementById('main-nav');
  var btn = document.getElementById('menu-btn');
  var menu = document.getElementById('mobile-menu');

  // Scroll effect
  if(nav) {
    window.addEventListener('scroll', function(){
      nav.classList.toggle('scrolled', window.scrollY > 20);
    });
  }

  // Mobile menu toggle
  if(btn && menu) {
    btn.addEventListener('click', function(){
      btn.classList.toggle('open');
      menu.classList.toggle('open');
      document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    });
  }

  // Active page detection
  var p = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link, .mobile-link').forEach(function(l){
    var d = l.getAttribute('data-page');
    if(d && (p.indexOf(d) !== -1 || (p === '' && d === 'index'))) {
      l.classList.add('active');
    }
  });

  // Close mobile menu on link click
  document.querySelectorAll('.mobile-link').forEach(function(l){
    l.addEventListener('click', function(){
      if(btn) btn.classList.remove('open');
      if(menu) menu.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
})();
</script>
