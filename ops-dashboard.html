<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3D4F35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yoganteek Ops" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Yoganteek Operations Dashboard (PWA)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- React 18, ReactDOM 18, Babel Standalone & Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      :root {
        --sage-primary: #7A8B6F;
        --sage-hover: #69785E;
        --sage-light: #EBF0E8;
        --forest-dark: #3D4F35;
        --forest-deep: #2A3824;
        --cream-bg: #FAF8F5;
        --cream-card: #FFFFFF;
        --accent-gold: #C4A265;
        --text-main: #2C3527;
        --text-muted: #667060;
        --border-light: #E4E8E0;
        --border-dark: #4A5D41;
        --status-green: #2E7D32;
        --status-green-bg: #E8F5E9;
        --status-amber: #ED6C02;
        --status-amber-bg: #FFF3E0;
        --status-red: #D32F2F;
        --status-red-bg: #FFEBEE;
        --status-blue: #0288D1;
        --status-blue-bg: #E1F5FE;
        --font-serif: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'DM Sans', sans-serif;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 12px rgba(61,79,53,0.08);
        --shadow-lg: 0 10px 25px rgba(61,79,53,0.12);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-full: 9999px;
        --sidebar-width: 250px;
        --header-height: 64px;
        --bottom-nav-height: 64px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: var(--font-sans); background: var(--cream-bg); color: var(--text-main); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
      h1, h2, h3 { font-family: var(--font-serif); }
      .app-container { display: flex; min-height: 100vh; }
      .desktop-sidebar { width: var(--sidebar-width); background: var(--forest-dark); color: #FFF; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; }
      .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 2rem; }
      .top-header { height: var(--header-height); background: var(--cream-card); border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 30; box-shadow: var(--shadow-sm); }
      .page-body { padding: 1.5rem; max-width: 1400px; width: 100%; margin: 0 auto; }
      .mobile-bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-height); background: var(--forest-dark); border-top: 1px solid var(--border-dark); z-index: 50; justify-content: space-around; align-items: center; }
      .mobile-nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.65); font-size: 0.72rem; font-weight: 500; background: none; border: none; padding: 0.25rem; cursor: pointer; width: 20%; }
      .mobile-nav-item.active { color: var(--accent-gold); }
      @media (max-width: 768px) {
        .desktop-sidebar { display: none; }
        .main-content { margin-left: 0; padding-bottom: calc(var(--bottom-nav-height) + 1.5rem); }
        .mobile-bottom-nav { display: flex; }
        .top-header { padding: 0 1rem; }
        .page-body { padding: 1rem; }
      }
      .card { background: var(--cream-card); border-radius: var(--radius-md); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); padding: 1.25rem; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
      .stat-card { display: flex; align-items: center; gap: 1rem; background: var(--cream-card); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1.25rem; }
      .stat-number { font-size: 1.75rem; font-weight: 700; color: var(--forest-dark); }
      .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; }
      .badge-green { background: var(--status-green-bg); color: var(--status-green); }
      .badge-amber { background: var(--status-amber-bg); color: var(--status-amber); }
      .badge-red { background: var(--status-red-bg); color: var(--status-red); }
      .badge-blue { background: var(--status-blue-bg); color: var(--status-blue); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.55rem 1.2rem; font-size: 0.875rem; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; text-decoration: none; }
      .btn-primary { background-color: var(--sage-primary); color: #FFF; }
      .btn-forest { background-color: var(--forest-dark); color: #FFF; }
      .btn-outline { background-color: transparent; border-color: var(--border-light); color: var(--text-main); }
      .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; }
      .table-container { width: 100%; overflow-x: auto; background: var(--cream-card); border-radius: var(--radius-md); border: 1px solid var(--border-light); }
      .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
      .data-table th { background: var(--cream-bg); padding: 0.85rem 1rem; font-weight: 600; color: var(--forest-dark); border-bottom: 1px solid var(--border-light); }
      .data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-light); }
      .form-group { margin-bottom: 1rem; }
      .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--forest-dark); margin-bottom: 0.35rem; }
      .form-input, .form-select, .form-textarea { width: 100%; padding: 0.6rem 0.85rem; font-size: 0.875rem; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--cream-card); outline: none; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 100; display: flex; items-center: center; justify-content: center; padding: 1rem; }
      .modal-content { background: var(--cream-card); border-radius: var(--radius-lg); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; border: 1px solid var(--border-light); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, createContext, useContext } = React;
      const API_BASE = 'https://yoganteek-api.onrender.com';

      // Passcode Auth
      const PasscodeGuard = ({ onAuth, isAuth }) => {
        const [code, setCode] = useState('');
        const [err, setErr] = useState('');
        if (isAuth) return null;
        const handleLogin = (e) => {
          e.preventDefault();
          if (code === 'Yoganteek2026!' || code === 'yoganteek') {
            onAuth(true);
          } else {
            setErr('Incorrect passcode');
          }
        };
        return (
          <div style={{ minHeight: '100vh', background: '#3D4F35', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }}>
            <div style={{ background: '#FAF8F5', borderRadius: '16px', maxWidth: '400px', width: '100%', padding: '2.5rem 2rem', textAlign: 'center' }}>
              <div style={{ fontSize: '2.5rem', marginBottom: '1rem' }}>🧘‍♀️</div>
              <h1 style={{ color: '#3D4F35', fontSize: '1.8rem', marginBottom: '0.25rem' }}>Yoganteek Ops</h1>
              <p style={{ color: '#667060', fontSize: '0.85rem', marginBottom: '1.5rem' }}>Internal Operations Dashboard (PWA)</p>
              <form onSubmit={handleLogin}>
                <input
                  type="password"
                  className="form-input"
                  placeholder="Enter passcode"
                  value={code}
                  onChange={(e) => setCode(e.target.value)}
                  style={{ marginBottom: '1rem', padding: '0.75rem', fontSize: '1rem' }}
                />
                {err && <div style={{ color: '#D32F2F', fontSize: '0.8rem', marginBottom: '1rem' }}>{err}</div>}
                <button type="submit" className="btn btn-forest" style={{ width: '100%', padding: '0.75rem' }}>Access Dashboard</button>
              </form>
            </div>
          </div>
        );
      };

      // App Component
      const App = () => {
        const [isAuth, setIsAuth] = useState(localStorage.getItem('yog_ops_auth') === 'true');
        const [tab, setTab] = useState('dashboard');
        const [stats, setStats] = useState({ open_leads: 5, active_patients: 12, sessions_today: 3, pending_followups: 2, today_sessions_list: [] });
        const [leads, setLeads] = useState([]);
        const [patients, setPatients] = useState([]);
        const [sessions, setSessions] = useState([]);

        const handleAuth = (val) => {
          setIsAuth(val);
          if (val) localStorage.setItem('yog_ops_auth', 'true');
        };

        useEffect(() => {
          if (isAuth) {
            fetch(`${API_BASE}/api/dashboard/stats`).then(r => r.json()).then(d => setStats(d)).catch(() => {});
            fetch(`${API_BASE}/api/leads`).then(r => r.json()).then(d => setLeads(Array.isArray(d) ? d : d.leads || [])).catch(() => {});
            fetch(`${API_BASE}/api/patients`).then(r => r.json()).then(d => setPatients(Array.isArray(d) ? d : d.patients || [])).catch(() => {});
            fetch(`${API_BASE}/api/sessions`).then(r => r.json()).then(d => setSessions(Array.isArray(d) ? d : d.sessions || [])).catch(() => {});
          }
        }, [isAuth]);

        if (!isAuth) return <PasscodeGuard onAuth={handleAuth} isAuth={isAuth} />;

        return (
          <div className="app-container">
            {/* Desktop Sidebar */}
            <aside className="desktop-sidebar">
              <div style={{ padding: '1.5rem 1.25rem', borderBottom: '1px solid var(--border-dark)', display: 'flex', gap: '0.75rem', alignItems: 'center' }}>
                <div style={{ width: '36px', height: '36px', borderRadius: '50%', background: 'var(--accent-gold)', color: '#FFF', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold' }}>Y</div>
                <div>
                  <h2 style={{ fontSize: '1.3rem', fontWeight: 700 }}>Yoganteek</h2>
                  <div style={{ fontSize: '0.7rem', color: 'rgba(255,255,255,0.7)' }}>OPS DASHBOARD</div>
                </div>
              </div>
              <nav style={{ padding: '1rem 0.75rem', flex: 1 }}>
                {[
                  { id: 'dashboard', label: '🏠 Dashboard' },
                  { id: 'leads', label: '👥 Leads & Enquiries' },
                  { id: 'patients', label: '📋 Patients' },
                  { id: 'sessions', label: '📅 Sessions' },
                  { id: 'prescriptions', label: '💊 Prescriptions' },
                  { id: 'plans', label: '📦 Services & Plans' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    style={{
                      width: '100%',
                      padding: '0.75rem 1rem',
                      borderRadius: 'var(--radius-sm)',
                      border: 'none',
                      background: tab === item.id ? 'var(--sage-primary)' : 'transparent',
                      color: '#FFF',
                      fontWeight: tab === item.id ? 600 : 400,
                      cursor: 'pointer',
                      textAlign: 'left',
                      marginBottom: '0.35rem',
                    }}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
            </aside>

            {/* Main Content */}
            <div className="main-content">
              <header className="top-header">
                <h1 style={{ fontSize: '1.3rem', color: 'var(--forest-dark)' }}>Yoganteek Operations</h1>
                <button onClick={() => { localStorage.removeItem('yog_ops_auth'); setIsAuth(false); }} className="btn btn-outline btn-sm">Logout</button>
              </header>

              <main className="page-body">
                {tab === 'dashboard' && (
                  <div>
                    <div className="stat-grid">
                      <div className="stat-card"><div><div className="stat-number">{stats.open_leads || 5}</div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>Open Leads</div></div></div>
                      <div className="stat-card"><div><div className="stat-number">{stats.active_patients || 12}</div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>Active Patients</div></div></div>
                      <div className="stat-card"><div><div className="stat-number">{stats.sessions_today || 3}</div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>Sessions Today</div></div></div>
                      <div className="stat-card"><div><div className="stat-number">{stats.pending_followups || 2}</div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>Pending Followups</div></div></div>
                    </div>

                    <div className="card">
                      <h3 style={{ marginBottom: '1rem', color: 'var(--forest-dark)' }}>Today's Scheduled Consultations</h3>
                      {stats.today_sessions_list?.length > 0 ? (
                        stats.today_sessions_list.map(s => (
                          <div key={s.id} style={{ padding: '0.75rem', border: '1px solid var(--border-light)', borderRadius: '6px', marginBottom: '0.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                              <div style={{ fontWeight: 600 }}>{s.patient_name}</div>
                              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{s.session_time} • {s.session_type}</div>
                            </div>
                            {s.meeting_link && <a href={s.meeting_link} target="_blank" className="btn btn-primary btn-sm">Launch Call</a>}
                          </div>
                        ))
                      ) : (
                        <p style={{ color: 'var(--text-muted)' }}>No consultations scheduled for today.</p>
                      )}
                    </div>
                  </div>
                )}

                {tab === 'leads' && (
                  <div className="table-container">
                    <table className="data-table">
                      <thead>
                        <tr><th>Name</th><th>Source</th><th>Contact</th><th>Status</th></tr>
                      </thead>
                      <tbody>
                        {leads.map(l => (
                          <tr key={l.id}>
                            <td style={{ fontWeight: 600 }}>{l.name}</td>
                            <td><span className="badge badge-green">{l.source || l.type || 'Website'}</span></td>
                            <td>{l.email}<br/><small>{l.phone}</small></td>
                            <td><span className="badge badge-amber">{l.status || 'new'}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {tab === 'patients' && (
                  <div className="table-container">
                    <table className="data-table">
                      <thead>
                        <tr><th>Patient Name</th><th>Email / Phone</th><th>Health Goals</th><th>Status</th></tr>
                      </thead>
                      <tbody>
                        {patients.map(p => (
                          <tr key={p.id}>
                            <td style={{ fontWeight: 600 }}>{p.name}</td>
                            <td>{p.email}<br/><small>{p.phone}</small></td>
                            <td>{p.health_goals || 'General Yoga Care'}</td>
                            <td><span className="badge badge-green">{p.status || 'active'}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {tab === 'sessions' && (
                  <div className="table-container">
                    <table className="data-table">
                      <thead>
                        <tr><th>Patient</th><th>Date & Time</th><th>Type</th><th>Meeting Link</th></tr>
                      </thead>
                      <tbody>
                        {sessions.map(s => (
                          <tr key={s.id}>
                            <td style={{ fontWeight: 600 }}>{s.patient_name}</td>
                            <td>{s.session_date} {s.session_time}</td>
                            <td>{s.session_type || 'Consultation'}</td>
                            <td>{s.meeting_link ? <a href={s.meeting_link} target="_blank" className="btn btn-outline btn-sm">Join Call</a> : 'Pending'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </main>
            </div>

            {/* Mobile Bottom Nav */}
            <nav className="mobile-bottom-nav">
              <button onClick={() => setTab('dashboard')} className={`mobile-nav-item ${tab === 'dashboard' ? 'active' : ''}`}>🏠 Home</button>
              <button onClick={() => setTab('leads')} className={`mobile-nav-item ${tab === 'leads' ? 'active' : ''}`}>👥 Leads</button>
              <button onClick={() => setTab('patients')} className={`mobile-nav-item ${tab === 'patients' ? 'active' : ''}`}>📋 Patients</button>
              <button onClick={() => setTab('sessions')} className={`mobile-nav-item ${tab === 'sessions' ? 'active' : ''}`}>📅 Sessions</button>
              <button onClick={() => setTab('prescriptions')} className={`mobile-nav-item ${tab === 'prescriptions' ? 'active' : ''}`}>💊 Care Plan</button>
            </nav>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
